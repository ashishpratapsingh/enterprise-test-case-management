name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Backend — pytest + coverage floor on a SQLite + Postgres matrix.
  #
  # Why two DBs? The app supports both via SQLAlchemy + dialect-aware
  # SQL, and we've been bitten before by Postgres-only constructs
  # (date_trunc, INTERVAL casts) that pass on dev SQLite but explode
  # in prod. Running both keeps that whole bug class out of the
  # codebase.
  # ────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest, ${{ matrix.dbname }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dbname: sqlite
            database_url: ""  # use the app's SQLite default
          - dbname: postgres
            database_url: postgresql+asyncpg://tcm_user:tcm_pass@localhost:5432/tcm_db
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcm_user
          POSTGRES_PASSWORD: tcm_pass
          POSTGRES_DB: tcm_db
        options: >-
          --health-cmd "pg_isready -U tcm_user -d tcm_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes pip-audit

      - name: Lint (pyflakes — unused imports / undefined names)
        continue-on-error: true
        run: python -m pyflakes app/ | grep "imported but unused" || true

      - name: Dependency CVE audit (informational)
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict || true

      - name: Run tests with coverage
        env:
          DEBUG: "true"
          SECRET_KEY: "ci-only-ephemeral-secret-not-for-production-use"
          # Empty value falls through to the app's SQLite default.
          DATABASE_URL: ${{ matrix.database_url }}
        run: |
          pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.dbname }}
          path: backend/coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Frontend — type-check + Jest
  # ────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency CVE audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev || true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Jest
        env:
          CI: "true"
        run: npx react-scripts test --watchAll=false --passWithNoTests
