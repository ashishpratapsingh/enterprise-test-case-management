server {
    # Port 8080 — matches the unprivileged nginx image (UID 101 can't
    # bind to <1024). Map to 80/443 at the edge load balancer.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ── API proxy ──────────────────────────────────────────────────
    # Forward /api/ to the backend container. ``X-Request-ID`` is
    # injected if the client didn't send one, then forwarded so the
    # backend's RequestIDMiddleware reuses it instead of generating a
    # new id — keeps frontend ↔ backend logs joinable.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # SPA fallback — serve index.html for all non-file routes so
    # client-side routing (/projects, /test-cases, etc.) works on
    # direct URL hits.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively. Filenames are hash-suffixed
    # by the build, so ``immutable`` is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
